# GENERATED by tools/generate_stack.py — edit gateways.json and re-run (./setup.sh -g)
# Powerwall Dashboard — 2-gateway stack
# Extends jasonacox/Powerwall-Dashboard for independent Powerwall gateways.
# See ARCHITECTURE.md for design rationale.

name: powerwall-dashboard

services:

  # ── InfluxDB ────────────────────────────────────────────────────────────────
  influxdb:
    image: influxdb:1.8
    container_name: influxdb
    hostname: influxdb
    restart: unless-stopped
    # Give InfluxDB time to flush cleanly on host shutdown (default is 10s)
    stop_grace_period: 30s
    ports:
      - "${INFLUXDB_PORT:-8086}:8086"
    volumes:
      - type: bind
        source: ./influxdb/influxdb.conf
        target: /etc/influxdb/influxdb.conf
        read_only: true
      - type: bind
        source: ./influxdb/influxdb.sql
        target: /var/lib/influxdb/influxdb.sql
        read_only: true
      - influxdb_data:/var/lib/influxdb
    env_file:
      - influxdb.env
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8086/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── pyPowerwall — Panel A (panel_a) ─────────────────────────────
  # TEDAPI mode: authenticates directly to the gateway at PW_HOST over HTTPS.
  # No Tesla account, FleetAPI registration, or OAuth tokens required.
  # Set PW_HOST and PW_GW_PWD in pypowerwall-a.env before starting.
  pypowerwall-a:
    image: jasonacox/pypowerwall:latest
    container_name: pypowerwall-a
    hostname: pypowerwall-a
    restart: unless-stopped
    ports:
      - "${PW_A_PORT:-8675}:8675"
    volumes:
      - type: bind
        source: ./data/auth-a
        target: /app/.auth
    env_file:
      - pypowerwall-a.env
    environment:
      - PW_PORT=8675
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--spider", "http://127.0.0.1:8675/api/site_info"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── pyPowerwall — Panel B (panel_b) ─────────────────────────────
  # TEDAPI mode: authenticates directly to the gateway at PW_HOST over HTTPS.
  # No Tesla account, FleetAPI registration, or OAuth tokens required.
  # Set PW_HOST and PW_GW_PWD in pypowerwall-b.env before starting.
  pypowerwall-b:
    image: jasonacox/pypowerwall:latest
    container_name: pypowerwall-b
    hostname: pypowerwall-b
    restart: unless-stopped
    ports:
      - "${PW_B_PORT:-8676}:8675"
    volumes:
      - type: bind
        source: ./data/auth-b
        target: /app/.auth
    env_file:
      - pypowerwall-b.env
    environment:
      - PW_PORT=8675
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--spider", "http://127.0.0.1:8675/api/site_info"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Telegraf (single instance, polls pypowerwall-a and pypowerwall-b) ──────
  telegraf:
    image: telegraf:1.28
    container_name: telegraf
    hostname: telegraf
    restart: unless-stopped
    volumes:
      - type: bind
        source: ./telegraf/telegraf.conf
        target: /etc/telegraf/telegraf.conf
        read_only: true
      - type: bind
        source: ./telegraf/telegraf.local
        target: /etc/telegraf/telegraf.local
        read_only: true
    env_file:
      - compose.env
    depends_on:
      influxdb:
        condition: service_healthy
      pypowerwall-a:
        condition: service_healthy
      pypowerwall-b:
        condition: service_healthy
    command: telegraf --config /etc/telegraf/telegraf.conf --config /etc/telegraf/telegraf.local
    healthcheck:
      test: ["CMD", "pgrep", "telegraf"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Enricher (derived metrics: self-sufficiency, EV load, savings) ──────────
  enricher:
    build:
      context: ./enricher
      dockerfile: Dockerfile
    image: powerwall-enricher:latest
    container_name: enricher
    hostname: enricher
    restart: unless-stopped
    volumes:
      # Settings-page state (rates/capacities), written by the webapp
      - type: bind
        source: ./data/webapp
        target: /data
        read_only: true
    env_file:
      - compose.env
    environment:
      - INFLUXDB_HOST=influxdb
      - INFLUXDB_PORT=8086
      - INFLUXDB_DATABASE=powerwall
      - TZ=${TZ:-America/Los_Angeles}
      - GATEWAY_TAGS=${GATEWAY_TAGS:-panel_a,panel_b}
      - SETTINGS_PATH=/data/settings.json
    depends_on:
      influxdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import enricher; enricher.health_check()"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s

  # ── Grafana ─────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    hostname: grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-9000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - type: bind
        source: ./grafana/provisioning
        target: /etc/grafana/provisioning
        read_only: true
      - type: bind
        source: ./grafana/dashboards
        target: /var/lib/grafana/dashboards
        read_only: true
      # Custom synthwave branding — override Grafana's default favicon + iOS icon.
      # Grafana serves these from public/build/img (fingerprinted); public/img is
      # mounted too for robustness across versions.
      - type: bind
        source: ./grafana/branding/fav32.png
        target: /usr/share/grafana/public/build/img/fav32.png
        read_only: true
      - type: bind
        source: ./grafana/branding/apple-touch-icon.png
        target: /usr/share/grafana/public/build/img/apple-touch-icon.png
        read_only: true
      - type: bind
        source: ./grafana/branding/fav32.png
        target: /usr/share/grafana/public/img/fav32.png
        read_only: true
      - type: bind
        source: ./grafana/branding/apple-touch-icon.png
        target: /usr/share/grafana/public/img/apple-touch-icon.png
        read_only: true
    env_file:
      - grafana.env
    depends_on:
      influxdb:
        condition: service_healthy
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Custom Web Dashboard (synthwave UI) ─────────────────────────────────────
  # FastAPI app that queries InfluxDB over the compose network (InfluxDB itself
  # is not exposed to the LAN) and serves the static synthwave SPA on WEBAPP_PORT.
  webapp:
    build:
      context: ./webapp
      dockerfile: Dockerfile
    image: powerwall-webapp:latest
    container_name: webapp
    hostname: webapp
    restart: unless-stopped
    ports:
      - "${WEBAPP_PORT:-8050}:8050"
    volumes:
      # Persisted settings-page state (settings.json)
      - type: bind
        source: ./data/webapp
        target: /data
    env_file:
      - compose.env
    environment:
      - INFLUXDB_HOST=influxdb
      - INFLUXDB_PORT=8086
      - INFLUXDB_DATABASE=powerwall
      - WEBAPP_PORT=8050
      - TZ=${TZ:-America/Los_Angeles}
      - GATEWAY_TAGS=${GATEWAY_TAGS:-panel_a,panel_b}
      - SETTINGS_PATH=/data/settings.json
    depends_on:
      influxdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8050/api/health').status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ── Weather411 (optional) ───────────────────────────────────────────────────
  weather411:
    image: jasonacox/weather411:latest
    container_name: weather411
    hostname: weather411
    restart: unless-stopped
    environment:
      - WEATHERCONF=/var/lib/weather/weather411.conf
    ports:
      - "${WEATHER_PORT:-8680}:8676"
    volumes:
      - type: bind
        source: ./weather
        target: /var/lib/weather
        read_only: true
    depends_on:
      influxdb:
        condition: service_healthy
    # The /stats API port is flaky in 0.2.3; the weather-fetch job runs in the
    # same process, so a process check reflects real health (data → InfluxDB).
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -q '[s]erver.py' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    profiles:
      - weather

volumes:
  # InfluxDB time-series data — back this up regularly (see docs/UNRAID_SETUP.md)
  influxdb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${INFLUXDB_DATA_PATH:-./data/influxdb}
  # Grafana dashboards, user preferences, and alert state
  grafana_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${GRAFANA_DATA_PATH:-./data/grafana}
