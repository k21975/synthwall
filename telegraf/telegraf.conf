# GENERATED by tools/generate_stack.py — edit gateways.json and re-run (./setup.sh -g)
# telegraf.conf — Powerwall Dashboard (2 gateways)
# Polls pypowerwall-a (Panel A) and pypowerwall-b (Panel B) every 5 seconds.
# Each measurement is tagged with system=panel_a / system=panel_b.
# Combined metrics are written by the enricher service, not Telegraf.

[agent]
  interval = "5s"
  round_interval = true
  metric_batch_size = 360
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = ""
  hostname = ""
  omit_hostname = true
  log_with_timezone = "$TZ"

# ── InfluxDB output ────────────────────────────────────────────────────────────
[[outputs.influxdb]]
  urls = ["http://influxdb:8086"]
  database = "powerwall"
  retention_policy = "raw"
  skip_database_creation = false
  timeout = "5s"

# ══════════════════════════════════════════════════════════════════════════════
# PANEL A  (system=panel_a)
# ══════════════════════════════════════════════════════════════════════════════

# /aggregates — main power flows (json_v2 maps Tesla nested JSON → named fields)
[[inputs.http]]
  urls = ["http://pypowerwall-a:8675/aggregates"]
  method = "GET"
  timeout = "5s"
  data_format = "json_v2"
  [[inputs.http.json_v2]]
    measurement_name = "http"
    [[inputs.http.json_v2.field]]
      path = "load.instant_power"
